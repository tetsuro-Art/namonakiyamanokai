<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンバーズカード表示</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 👇 カードと時計を重ねるための基準になる枠 */
        .container {
            position: relative; /* 重ね配置の基準点にする */
            width: 100%;
            max-width: 1400px;
        }

        .members-card {
            width: 100%;
            height: auto;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            animation: flash 3s infinite linear;
            display: block; /* 画像の下に変な隙間が空くのを防ぐ */
        }

        /* 👇 カードの右下に重ねて表示するデザイン */
        .security-timer {
            position: absolute;     /* 基準の枠（カード）に対して絶対配置にする */
            bottom: 25px;           /* カードの下端から 25px の位置 */
            right: 25px;            /* カードの右端から 25px の位置 */
            
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;      /* カードに馴染むように少しだけサイズを調整 */
            font-weight: bold;
            color: #ffffff;         /* カードの上で見やすいように白文字に変更 */
            background-color: rgba(0, 0, 0, 0.6); /* 黒の半透明背景（文字をくっきり見せるため） */
            padding: 8px 18px;
            border-radius: 8px;     /* すこし角を丸くする */
            letter-spacing: 1px;
            z-index: 10;            /* 必ずカードより手前に表示させる */
        }

        @keyframes flash {
            0% { filter: brightness(1); }
            45% { filter: brightness(1); }
            50% { filter: brightness(1.8); }
            55% { filter: brightness(1); }
            100% { filter: brightness(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="images/membership-card.png" alt="メンバーズカード" class="members-card">
        
        <!-- 👇 カードの右下に重なって表示されるようになります -->
        <div id="timer" class="security-timer">0000/00/00 00:00:00</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeString = `${year}/${month}/${date} ${hours}:${minutes}:${seconds}`;
            document.getElementById('timer').textContent = timeString;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
